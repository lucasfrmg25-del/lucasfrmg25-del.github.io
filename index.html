=[['Assistente Administrativo','MGS • Desde jun/2026'],['Analista de Segurança Pleno','Cora • mai/2023 a out/2024'],['Analista de Segurança do Cliente Júnior','Cora • dez/2021 a mai/2023']];const certs=['Bacharelado em Engenharia de Alimentos — UFES (2015–2021)','Six Sigma White Belt','Introduction to AI','SQL','IBM Data Analyst — Em andamento','Trilhas de Python e análise de dados — Em andamento'];const chat={pt:{subtitle:'Assistente do portfólio',placeholder:'Pergunte sobre Lucas...',greeting:'Olá! 👋 Sou o Lucas AI, assistente deste portfólio. Posso te contar sobre experiência, projetos, competências e certificações. O que você gostaria de conhecer?',actions:['Experiência em Fraude','Projetos de Dados','SQL & Python','Certificações','Formação e Carreira','Outros assuntos']},en:{subtitle:'Portfolio assistant',placeholder:'Ask about Lucas...',greeting:"Hello! 👋 I'm Lucas AI, this portfolio's assistant. I can tell you about experience, projects, skills, and certifications. What would you like to know?",actions:['Fraud Experience','Data Projects','SQL & Python','Certifications','Education & Career','Other topics']}};const answers={pt:{fraud:'Lucas tem experiência prática em prevenção a fraude, onboarding e análise de alto volume transacional. Sua atuação inclui PIX, TED, boleto e link, análise documental, titularidade e PJ, além de indicadores, falsos positivos e gaps entre áreas.',projects:'Os projetos em destaque são Fraud Analytics SQL, Pode Pix?, Fraud Dashboard e Python Fraud Engine. Eles combinam consultas, indicadores, visualização e classificação de transações.',tech:'Em dados, Lucas desenvolve projetos com SQL, MySQL, PostgreSQL, Python, Pandas e NumPy. Também utiliza Excel, Power BI e IBM Cognos Analytics para análise e comunicação visual.',certs:'As certificações e trilhas listadas são Six Sigma White Belt, Introduction to AI, SQL, IBM Data Analyst em andamento e trilhas de Python e análise de dados em andamento.',career:'Lucas atua como Assistente Administrativo na MGS desde jun/2026. Antes, trabalhou na Cora como Analista de Segurança Pleno, de mai/2023 a out/2024, e Analista de Segurança do Cliente Júnior, de dez/2021 a mai/2023. É bacharel em Engenharia de Alimentos pela UFES (2015–2021).',languages:'Idiomas: inglês intermediário, espanhol básico e francês iniciante.',contact:'Você pode falar com Lucas pelo LinkedIn, consultar seus projetos no GitHub ou enviar um e-mail para lucasfrmg25@gmail.com.',unknown:'Essa informação não está disponível neste portfólio. Para confirmar esse ponto, entre em contato com Lucas pelo LinkedIn ou pelo e-mail lucasfrmg25@gmail.com.'},en:{fraud:'Lucas has hands-on experience in fraud prevention, onboarding, and high-volume transaction analysis across PIX, wire transfers, invoices, and payment links, including documents, ownership, business accounts, indicators, false positives, and cross-team gaps.',projects:'Featured projects are Fraud Analytics SQL, Pode Pix?, Fraud Dashboard, and Python Fraud Engine. They combine queries, indicators, visualization, and transaction classification.',tech:'Lucas develops data projects with SQL, MySQL, PostgreSQL, Python, Pandas, and NumPy. He also uses Excel, Power BI, and IBM Cognos Analytics for analysis and visualization.',certs:'Listed certifications and tracks are Six Sigma White Belt, Introduction to AI, SQL, IBM Data Analyst in progress, and Python/data analytics tracks in progress.',career:'Lucas currently works as an Administrative Assistant at MGS since Jun 2026. Previously, he worked at Cora as a Mid-level Security Analyst from May 2023 to Oct 2024 and a Junior Customer Security Analyst from Dec 2021 to May 2023. He holds a Bachelor’s degree in Food Engineering from UFES (2015–2021).',languages:'Languages: intermediate English, basic Spanish, and beginner French.',contact:'Contact Lucas on LinkedIn, view his projects on GitHub, or email lucasfrmg25@gmail.com.',unknown:'That information is not available in this portfolio. Please contact Lucas on LinkedIn or email lucasfrmg25@gmail.com to confirm it.'}};let lang='pt',aiStarted=false;function render(){const d=data[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.getElementById('nav').innerHTML=d.nav.map((x,i)=>`<a href="#${['sobre','competencias','projetos','experiencia','formacao','contato'][i]}">${x}</a>`).join('');document.getElementById('points').innerHTML=d.points.map((x,i)=>`<div class="box"><span class="yellow">0${i+1}</span><p>${x}</p></div>`).join('');document.getElementById('skills').innerHTML=skills.map(g=>`<div class="skill"><h3>${g[0]}</h3><div class="tags">${g.slice(1).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`).join('');document.getElementById('projects').innerHTML=projects.map((p,i)=>`<article class="project"><span class="yellow">0${i+1}</span><h3>${p[0]}</h3><p>${p[3]}</p><small>${p[2]}</small><button onclick="openModal(${i})">${lang==='pt'?'Explorar projeto':'Explore project'} →</button></article>`).join('');document.getElementById('jobs').innerHTML=jobs.map((j,i)=>`<div class="job"><small>0${i+1}</small><h3>${j[0]}</h3><p>${j[1]}</p></div>`).join('');document.getElementById('certs').innerHTML=certs.map(x=>`<div class="cert">${x}</div>`).join('');renderAI()}function setLang(x){lang=x;render();if(aiStarted){document.getElementById('aiMessages').innerHTML='';addMsg(chat[lang].greeting,'bot')}}function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('lucas-theme',document.documentElement.classList.contains('dark')?'dark':'light')}function openModal(i){const p=projects[i];document.getElementById('modalContent').innerHTML=`<span class="yellow">0${i+1}</span><h2>${p[0]}</h2><p>${p[3]}</p><div class="detail"><b>${lang==='pt'?'Ferramentas':'Tools'}</b><p>${p[2]}</p></div><div class="detail"><b>Status</b><p>${p[1]}</p></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}function renderAI(){const c=chat[lang];document.getElementById('aiSubtitle').textContent=c.subtitle;document.getElementById('aiInput').placeholder=c.placeholder;document.getElementById('aiQuick').innerHTML=c.actions.map(x=>`<button onclick="askQuick(this.textContent)">${x}</button>`).join('')}function toggleAI(){const el=document.getElementById('aiChat');el.classList.toggle('open');if(!aiStarted){aiStarted=true;addMsg(chat[lang].greeting,'bot')}if(el.classList.contains('open'))setTimeout(()=>document.getElementById('aiInput').focus(),100)}function addMsg(text,type){const m=document.createElement('div');m.className='msg '+type;m.textContent=text;const box=document.getElementById('aiMessages');box.appendChild(m);box.scrollTop=box.scrollHeight}function localAnswer(input){const q=input.toLocaleLowerCase('pt-BR'),r=answers[lang];if(/fraud|fraude|risco|risk|pix|ted|boleto|onboarding|transa/.test(q))return r.fraud;if(/projet|project|dashboard|engine|pode pix/.test(q))return r.projects;if(/sql|python|pandas|numpy|power bi|cognos|excel|compet|skill|ferrament/.test(q))return r.tech;if(/certif|six sigma|white belt|curso/.test(q))return r.certs;if(/forma|career|carreira|experi|trajet|education/.test(q))return r.career;if(/idioma|language|ingl|english|espanhol|franc/.test(q))return r.languages;if(/contato|contact|email|linkedin|github/.test(q))return r.contact;return r.unknown}function askQuick(x){addMsg(x,'user');setTimeout(()=>addMsg(localAnswer(x),'bot'),250)}function sendAI(e){e.preventDefault();const input=document.getElementById('aiInput'),v=input.value.trim();if(!v)return;addMsg(v,'user');input.value='';setTimeout(()=>addMsg(localAnswer(v),'bot'),250)}if(localStorage.getItem('lucas-theme')==='dark'||(!localStorage.getItem('lucas-theme')&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');render();</script></body></html>
