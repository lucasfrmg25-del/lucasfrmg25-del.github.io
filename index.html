Text:'I am open to professional connections and opportunities to turn operational challenges into clear analysis and better controls.'}};const skills=[['Dados & Analytics','SQL / MySQL / PostgreSQL','Python','Pandas','NumPy','Análise de Dados','IA aplicada a dados'],['Fraude & Risco','Prevenção a Fraude','Risco','Análise transacional','Melhoria contínua / Six Sigma'],['Ferramentas','Excel','Power BI','IBM Cognos Analytics']];const projects=[['Fraud Analytics SQL','Projeto','SQL · MySQL · Data Analysis','Consultas SQL transformadas em indicadores operacionais para análise antifraude.'],['Pode Pix?','Em desenvolvimento','PostgreSQL · SQL · Risk Analysis','Consulta de identificadores PIX e denúncias, com evidências e níveis de atenção.'],['Fraud Dashboard','Projeto','IBM Cognos Analytics · Power BI · Data Visualization','Visão executiva e operacional dos principais KPIs de fraude e risco.'],['Python Fraud Engine','Em desenvolvimento','Python · Pandas · NumPy','Motor educacional progressivo para classificação e análise de transações.']];const jobs=[['Assistente Administrativo','MGS • Desde jun/2026'],['Analista de Segurança Pleno','Cora • mai/2023 a out/2024'],['Analista de Segurança do Cliente Júnior','Cora • dez/2021 a mai/2023']];const certs=['Bacharelado em Engenharia de Alimentos — UFES (2015–2021)','Six Sigma White Belt','Introduction to AI','SQL','IBM Data Analyst — Em andamento','Trilhas de Python e análise de dados — Em andamento'];let lang='pt';function render(){const d=data[lang];document.documentElement.lang=lang==='pt'?'pt-BR':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=d[e.dataset.t]);document.getElementById('nav').innerHTML=d.nav.map((x,i)=>`<a href="#${['sobre','competencias','projetos','experiencia','formacao','contato'][i]}">${x}</a>`).join('');document.getElementById('points').innerHTML=d.points.map((x,i)=>`<div class="box"><span class="yellow">0${i+1}</span><p>${x}</p></div>`).join('');document.getElementById('skills').innerHTML=skills.map(g=>`<div class="skill"><h3>${g[0]}</h3><div class="tags">${g.slice(1).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`).join('');document.getElementById('projects').innerHTML=projects.map((p,i)=>`<article class="project"><span class="yellow">0${i+1}</span><h3>${p[0]}</h3><p>${p[3]}</p><small>${p[2]}</small><button onclick="openModal(${i})">${lang==='pt'?'Explorar projeto':'Explore project'} →</button></article>`).join('');document.getElementById('jobs').innerHTML=jobs.map((j,i)=>`<div class="job"><small>0${i+1}</small><h3>${j[0]}</h3><p>${j[1]}</p></div>`).join('');document.getElementById('certs').innerHTML=certs.map(x=>`<div class="cert">${x}</div>`).join('')}function setLang(x){lang=x;render()}function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('lucas-theme',document.documentElement.classList.contains('dark')?'dark':'light')}function openModal(i){const p=projects[i];document.getElementById('modalContent').innerHTML=`<span class="yellow">0${i+1}</span><h2>${p[0]}</h2><p>${p[3]}</p><div class="detail"><b>${lang==='pt'?'Ferramentas':'Tools'}</b><p>${p[2]}</p></div><div class="detail"><b>${lang==='pt'?'Status':'Status'}</b><p>${p[1]}</p></div>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}if(localStorage.getItem('lucas-theme')==='dark'||(!localStorage.getItem('lucas-theme')&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark');render();</script></body></html>
