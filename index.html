nput id="aiInput" autocomplete="off"><button>➤</button></form></aside><script>const data={pt:{nav:['Sobre','Competências','Projetos','Experiência','Formação','Contato'],availability:'Dados que protegem decisões',role:'Analista de Dados | Prevenção a Fraudes e Risco',intro:'Profissional com experiência em prevenção a fraudes e operações de risco, desenvolvendo competências em análise de dados para transformar dados transacionais em decisões, controles e indicadores.',projectsBtn:'Ver projetos ↓',aboutK:'Perfil',aboutTitle:'Sobre mim',profile:'PERFIL PROFISSIONAL',about:'Atuação prática em prevenção a fraude e análise de transações, com experiência em onboarding, análise documental, titularidade e pessoa jurídica. Vivência com operações PIX, TED, boleto e link, acompanhamento de indicadores, redução de falsos positivos e identificação de gaps entre áreas — somada à evolução técnica contínua em dados.',points:['Leitura de risco em alto volume transacional','Controles orientados por indicadores','Visão operacional com evolução analítica'],skillsK:'Repertório',skillsTitle:'Competências',projectsK:'Portfólio',projectsTitle:'Projetos em evidência',projectsIntro:'Projetos que conectam dados, contexto de risco e clareza operacional.',expK:'Trajetória',expTitle:'Experiência',eduK:'Desenvolvimento contínuo',eduTitle:'Certificações & Formação',contactTitle:'Vamos conversar sobre dados, risco e decisões?',contactText:'Estou aberto a conexões profissionais e oportunidades para transformar desafios operacionais em análises claras e controles melhores.'},en:{nav:['About','Skills','Projects','Experience','Education','Contact'],availability:'Data that protects decisions',role:'Data Analyst | Fraud Prevention and Risk',intro:'Professional experienced in fraud prevention and risk operations, developing data analytics skills to turn transactional data into decisions, controls, and indicators.',projectsBtn:'View projects ↓',aboutK:'Profile',aboutTitle:'About me',profile:'PROFESSIONAL PRO =['Bacharelado em Engenharia de Alimentos — UFES','Six Sigma White Belt','Introduction to AI','SQL','IBM Data Analyst — Em andamento','Python e análise de dados — Em andamento'];const chat={pt:{subtitle:'Online · Assistente do portfólio',placeholder:'Digite sua pergunta...',greeting:'Olá! 👋 Eu sou o Lucas AI. Posso te ajudar a conhecer meu portfólio, projetos, experiência, certificações e muito mais.',actions:['Meus projetos','Minha experiência','Fraude e Risco','SQL e Python','Certificações','Carreira e objetivos']},en:{subtitle:'Online · Portfolio assistant',placeholder:'Type your question...',greeting:"Hello! 👋 I'm Lucas AI. I can help you explore my portfolio, projects, experience, certifications and more.",actions:['My projects','My experience','Fraud & Risk','SQL & Python','Certifications','Career & goals']}};const ans={pt:{fraud:'Lucas tem experiência prática em prevenção a fraude, onboarding e análise de alto volume transacional, incluindo PIX, TED, boleto, link, análise documental, titularidade e PJ.',projects:'Os projetos em destaque são Fraud Analytics SQL, Pode Pix?, Fraud Dashboard e Python Fraud Engine.',tech:'Lucas trabalha e estuda SQL, MySQL, PostgreSQL, Python, Pandas e NumPy, além de Excel, Power BI e IBM Cognos Analytics.',certs:'Entre as certificações e trilhas estão Six Sigma White Belt, Introduction to AI, SQL e IBM Data Analyst em andamento.',career:'Lucas atua como Assistente Administrativo na MGS. Antes, trabalhou na Cora como Analista de Segurança Pleno e Analista de Segurança do Cliente Júnior. É bacharel em Engenharia de Alimentos pela UFES.',contact:'Contato: LinkedIn, GitHub ou lucasfrmg25@gmail.com.',unknown:'Essa informação não está disponível no portfólio. Você pode confirmar diretamente com Lucas pelo LinkedIn ou e-mail.'},en:{fraud:'Lucas has hands-on experience in fraud prevention, onboarding and high-volume transaction analysis, including PIX, wire transfers, invoices, payment links, documents, ownership and business accounts.', .innerHTML=`<span class="yellow">0${i+1}</span><h2>${p[0]}</h2><p>${p[2]}</p><p>${p[1]}</p>`;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function renderAI(){const c=chat[lang];aiSubtitle.textContent=c.subtitle;aiInput.placeholder=c.placeholder;aiQuick.innerHTML=c.actions.map(x=>`<button onclick="askQuick(this.textContent)">${x}</button>`).join('')}function toggleAI(){aiChat.classList.toggle('open');if(!started){started=true;addMsg(chat[lang].greeting,'bot')}}function addMsg(t,type){const m=document.createElement('div');m.className='msg '+type;m.textContent=t;aiMessages.appendChild(m);aiMessages.scrollTop=aiMessages.scrollHeight}function answer(q){q=q.toLowerCase();const r=ans[lang];if(/fraud|fraude|risco|risk|pix|ted|boleto|onboarding/.test(q))return r.fraud;if(/projet|project|dashboard|engine|pode pix/.test(q))return r.projects;if(/sql|python|pandas|numpy|power bi|cognos|excel|compet|skill/.test(q))return r.tech;if(/certif|six sigma|white belt|curso/.test(q))return r.certs;if(/carreira|career|experi|forma|education|objetivo/.test(q))return r.career;if(/contato|contact|email|linkedin|github/.test(q))return r.contact;return r.unknown}function askQuick(x){addMsg(x,'user');setTimeout(()=>addMsg(answer(x),'bot'),220)}function sendAI(e){e.preventDefault();const v=aiInput.value.trim();if(!v)return;addMsg(v,'user');aiInput.value='';setTimeout(()=>addMsg(answer(v),'bot'),220)}const points=document.getElementById('points'),skillsEl=document.getElementById('skills'),projectsEl=document.getElementById('projects'),jobsEl=document.getElementById('jobs'),certsEl=document.getElementById('certs'),modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent'),aiChat=document.getElementById('aiChat'),aiMessages=document.getElementById('aiMessages'),aiSubtitle=document.getElementById('aiSubtitle'),aiQuick=document.getElementById('aiQuick'),aiInput=document.getElementById('aiInput');render();</script></body></html>
