name: Sync approved portfolio

on:
  push:
    paths:
      - '.github/workflows/sync-lovable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace GitHub Pages index with approved static build
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/lucasfrmg25-del/lucas-freire-martins-data-portfolio/main/github-pages.html?sync=20260929-1613' \
            --output index.html
          grep -q 'avatar-frame' index.html
          grep -q 'lucas-ai-avatar.png' index.html
          if grep -q 'avatar-svg' index.html; then
            echo 'Old avatar layout detected; refusing publish.'
            exit 1
          fi
          if grep -q 'chip c1' index.html; then
            echo 'Old floating metric cards detected; refusing publish.'
            exit 1
          fi
      - name: Commit published version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Publish approved portfolio directly'
            git push
          fi
