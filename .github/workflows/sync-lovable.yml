name: Sync Lovable portfolio

on:
  push:
    paths:
      - '.github/workflows/sync-lovable.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace GitHub Pages index with Lovable static build
        run: |
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/lucasfrmg25-del/lucas-freire-martins-data-portfolio/main/github-pages.html' \
            --output index.html
      - name: Commit published version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Publish Lovable portfolio to GitHub Pages'
            git push
          fi
